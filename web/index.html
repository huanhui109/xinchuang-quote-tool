<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />

  <title>服务器配置工作台</title>
  <link rel="stylesheet" href="styles.css" />
</head>

  <div id="app">

      </div>
      <nav id="nav"></nav>

    <main class="main">

        <div class="crumb" id="crumb">概览</div>

  <div class="modal-mask" id="modalMask" hidden>
    <div class="modal" id="modal"></div>
  </div>
  <div id="toast" class="toast" hidden></div>

  <script src="arch-graph.js"></script>
  <script src="arch-diagram.js"></script>
  <script src="hcl-core.js"></script>
  <script src="xlsx-read.js"></script>
